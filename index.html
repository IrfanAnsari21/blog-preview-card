<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog preview card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <img src="images/illustration-article.svg" alt="">
        <div class="container">
            <p id="status">Learning</p>
            <p id="date">Published 20 Feb 2026</p>
            <h2 id="course">HTML & CSS foundations</h2>
            <p id="about">These languages are the backbone of every website, defining structure, content and
                presentation.</p>
            <div class="profile">
                <img id="profilePic" src="images/image-avatar.webp" alt="">
                <p id="name">Greg Hooper</p>
            </div>
        </div>
    </div>
</body>

</html>
